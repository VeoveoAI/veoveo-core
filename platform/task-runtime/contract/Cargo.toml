[package]
name = "veoveo-task-contract"
# The enclosing `platform/task-runtime` package is outside the workspace.
workspace = "../../.."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# PostgreSQL `text` bindings for the vocabularies through sqlx.
postgres = ["dep:sqlx"]

[dependencies]
veoveo-types.workspace = true
serde.workspace = true
schemars.workspace = true
sqlx = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
