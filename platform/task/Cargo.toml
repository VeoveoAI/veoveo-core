[package]
name = "veoveo-task"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_task"
path = "src/lib.rs"

[dependencies]
veoveo-task-contract = { workspace = true, features = ["postgres"] }
veoveo-types.workspace = true
veoveo-store.workspace = true
async-stream = "0.3.6"
base64.workspace = true
chrono.workspace = true
futures.workspace = true
getrandom.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
hex.workspace = true
# The database conformance checks in testing/fixtures/database.rs, included by path.
pg_query.workspace = true
tokio = { workspace = true, features = ["full"] }
