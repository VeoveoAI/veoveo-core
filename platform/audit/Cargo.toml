[package]
name = "veoveo-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Stable releases verified from crates.io upstream metadata on 2026-09-30.
serde_json_canonicalizer = "=0.3.2"
ed25519-dalek = "=3.0.0"
base64.workspace = true
veoveo-types.workspace = true
veoveo-audit-contract = { workspace = true, features = ["postgres"] }
veoveo-store.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
futures.workspace = true
uuid.workspace = true
zeroize.workspace = true

http.workspace = true
url = { workspace = true, features = ["serde"] }
object_store.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"] }

[dev-dependencies]
# The PostgreSQL fixture in testing/fixtures/src/store.rs and the database conformance checks
# in testing/fixtures/src/database.rs, included by path.
hex.workspace = true
pg_query.workspace = true
secrecy.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["full"] }
axum.workspace = true
reqwest = { workspace = true, features = ["json"] }
