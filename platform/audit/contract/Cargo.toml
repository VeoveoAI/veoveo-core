[package]
name = "veoveo-audit-contract"
# The enclosing `platform/audit` package is outside the workspace.
workspace = "../../.."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# PostgreSQL bindings for the record vocabulary and the transactional append.
postgres = ["dep:sqlx"]

[dependencies]
veoveo-types.workspace = true
veoveo-mcp-ext-knowledge = { workspace = true, features = ["contract"] }
veoveo-artifact-contract.workspace = true
chrono.workspace = true
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
jsonschema.workspace = true
