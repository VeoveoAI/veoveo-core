[package]
name = "veoveo-platform-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_platform_store"
path = "src/lib.rs"

[features]
# The Gateway's state in the `gateway` schema, typed with the Gateway contracts.
gateway = ["dep:veoveo-gateway-contract", "dep:veoveo-mcp-contract"]

[dependencies]
veoveo-types.workspace = true
veoveo-gateway-contract = { workspace = true, optional = true }
veoveo-mcp-contract = { workspace = true, features = ["configuration"], optional = true }
base64.workspace = true
chrono.workspace = true
futures.workspace = true
percent-encoding.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde", "v5"] }

[dev-dependencies]
hex.workspace = true
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4", "v7"] }

[[test]]
name = "gateway"
required-features = ["gateway"]
