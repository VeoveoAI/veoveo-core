[package]
name = "veoveo-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_store"
path = "src/lib.rs"

[dependencies]
veoveo-types.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
percent-encoding.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde", "v5"] }

[dev-dependencies]
hex.workspace = true
# The database conformance checks in testing/fixtures/database.rs, included by path.
pg_query.workspace = true
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4", "v7"] }
