# cargo-deny 0.20 policy: dependency licenses, security advisories, bans and sources.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Licenses compatible with distributing an Apache-2.0 project. Add a license here only
# after reviewing it, and record crate-specific cases under `exceptions`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# SurrealDB 3.x publishes its Rust crates under the Business Source License 1.1. Its
# Additional Use Grant permits any use except offering the database as a Database
# Service, and each version converts to Apache-2.0 four years after release. Veoveo
# accepts these terms for the SurrealDB crates only; no other crate may use BUSL-1.1.
exceptions = [
    { crate = "surrealdb", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-cnf", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-common", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-engine-api", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-iam", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-parse-common", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-protocol", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-rpc", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-sql", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-strand", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-syn", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-types", allow = ["BUSL-1.1"] },
    { crate = "surrealdb-types-derive", allow = ["BUSL-1.1"] },
]

# The SurrealDB crates ship a BUSL-1.1 LICENSE file without a license field.
[[licenses.clarify]]
crate = "surrealdb"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-cnf"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-common"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-engine-api"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-iam"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-parse-common"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-rpc"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-sql"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-strand"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-syn"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-types"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-types-derive"
expression = "BUSL-1.1"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["VeoveoAI"]
