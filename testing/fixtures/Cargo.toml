[package]
name = "veoveo-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared test fixtures for repositories that consume veoveo-core"

[features]
store = [
    "dep:hex",
    "dep:secrecy",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "dep:uuid",
    "dep:veoveo-store",
    "dep:veoveo-types",
]
# Tenant-predicate, row-bound, index-use and schema checks over a crate's queries. Only
# test code depends on this feature, so pg_query never links into a service.
database-conformance = ["store", "dep:pg_query", "dep:serde", "dep:serde_json"]

[dependencies]
hex = { workspace = true, optional = true }
pg_query = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "macros", "process", "rt", "sync", "time"], optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
veoveo-store = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "database_conformance"
required-features = ["database-conformance"]
