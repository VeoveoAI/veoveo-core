[package]
name = "veoveo-mcp-ext-registration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["mcp", "signing", "client"]
contract = []
# Server keys and the signed software statement.
signing = ["dep:aws-lc-rs", "dep:jsonwebtoken", "dep:uuid"]
# The registration client a server runs: key storage, registration, renewal and removal.
client = ["signing", "dep:reqwest", "dep:tokio", "dep:tracing"]
mcp = ["dep:rmcp"]

[dependencies]
veoveo-types.workspace = true
veoveo-modules = { workspace = true, features = ["schema"] }
base64.workspace = true
chrono.workspace = true
schemars = { workspace = true, features = ["chrono04", "url2"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url = { workspace = true, features = ["serde"] }
aws-lc-rs = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider"] }
tokio = { workspace = true, optional = true, features = ["time", "macros"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
jsonschema.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid.workspace = true

[[test]]
name = "wire"
required-features = ["mcp"]

[[test]]
name = "client"
required-features = ["client"]
